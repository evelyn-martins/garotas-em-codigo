  <circle cx="132" cy="87" r="3" fill="#D6C0C0"/>
  <circle cx="268" cy="87" r="3" fill="#D6C0C0"/>
  <circle cx="132" cy="223" r="3" fill="#D6C0C0"/>
  <circle cx="268" cy="223" r="3" fill="#D6C0C0"/>

